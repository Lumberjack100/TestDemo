apply plugin: 'com.android.library'

android {
    compileSdkVersion rootProject.android.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.android.minSdkVersion
        targetSdkVersion rootProject.android.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "com.jakewharton.timber:timber:$rootProject.thirdLib.timberVersion"

    testImplementation "junit:junit:$rootProject.thirdLib.junit"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.thirdLib.testExtJunit"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.thirdLib.espresso"
}
