<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息收集清单</title>
    <style>
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            padding: 15px;
            margin: 0;
            background-color: #f9f9f9;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 14px;
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
            background-color: white;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4A89DC;
            color: white;
            font-weight: 500;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #e9f0f9;
        }
        @media (max-width: 768px) {
            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
            body {
                padding: 10px;
            }
            th, td {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <h1>个人信息收集清单</h1>
    
    <table>
        <thead>
            <tr>
                <th>信息名称</th>
                <th>使用目的</th>
                <th>使用场景</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>手机号码</td>
                <td>创建账号、登录</td>
                <td>首次创建账号时、通过手机号码登录时</td>
            </tr>
            <tr>
                <td>用户基本信息</td>
                <td>创建账号、对外展示</td>
                <td>首次创建账号时、用户自行编辑资料时</td>
            </tr>
            <tr>
                <td>设备参数及系统信息</td>
                <td>App安全运行、App功能兼容性分析</td>
                <td>用户冷启动 App 时</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
