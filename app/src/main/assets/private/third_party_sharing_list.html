<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第三方信息共享清单</title>
    <style>
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            padding: 15px;
            margin: 0;
            background-color: #f9f9f9;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 14px;
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4A89DC;
            color: white;
            font-weight: 500;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #e9f0f9;
        }
        @media (max-width: 768px) {
            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
            body {
                padding: 10px;
            }
            th, td {
                padding: 8px 10px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- <script src="../js/marked.min.js"></script> -->
</head>
<body>
    <div id="content"></div>
    
    <script>
        // 使用 XMLHttpRequest 代替 Fetch API 加载 Markdown 文件
        function loadMarkdown() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'third_party_sharing_list.md', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        // 成功加载 Markdown 文件
                        var markdown = xhr.responseText;
                        // 确保 marked 已加载
                        if (typeof marked === 'undefined') {
                            console.error('marked.js library is not loaded.');
                            document.getElementById('content').innerHTML = '<p>错误: Markdown 渲染库未加载。</p>';
                            return;
                        }
                        document.getElementById('content').innerHTML = marked.parse(markdown);
                    } else {
                        // 加载失败
                        console.error('Failed to load markdown file. Status: ' + xhr.status);
                        document.getElementById('content').innerHTML = '<p>加载内容失败，请稍后重试。</p>';
                    }
                }
            };
            xhr.onerror = function() {
                console.error('Error loading markdown file');
                document.getElementById('content').innerHTML = '<p>加载内容失败，请稍后重试。</p>';
            };
            xhr.send();
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', loadMarkdown);
    </script>
</body>
</html>
