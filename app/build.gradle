apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao'
apply plugin: 'com.jakewharton.butterknife'
/**
 * 获取APP名字
 * @return
 */
def getAppName() {
    return 'mCloud Device'
}

/**
 * 获取Git库HEAD的SHA1码前5位
 */
def gitShortCommitId() {
    def cmd = 'git rev-parse --short HEAD'
    cmd.execute().text.trim()
}

/**
 * 获取Git库的提交次数
 */
def gitVersionCode() {
    def cmd = 'git rev-list HEAD --count'
    cmd.execute().text.trim().toInteger()
}


android {
    compileSdkVersion rootProject.android.compileSdkVersion
    buildToolsVersion rootProject.android.buildToolsVersion

    defaultConfig {
        applicationId rootProject.android.applicationId
        minSdkVersion rootProject.android.minSdkVersion
        targetSdkVersion rootProject.android.targetSdkVersion
        versionCode gitVersionCode()
        versionName rootProject.android.versionName
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

//        manifestPlaceholders = ["mapApikey": "31d7ee436c402270e11183ce1b5d01dc",
//                                "pgyerKey" : "725bb8b9ee91e100e28d6623d8f8c86b"]
//
//        buildConfigField "String", "BUGLY_APPKEY", "\"6b0340b2b8\""

        ndk {
            //设置支持的SO库架构（开发者可以根据需要，选择一个或多个平台的so）
            abiFilters "armeabi", "armeabi-v7a"
        }
    }

    signingConfigs {
        debug {
            keyAlias 'mcloud'
            keyPassword '420529'
            storeFile file('../app/mcloud.jks')
            storePassword '420529'
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            keyAlias "mcloud"
            keyPassword "420529"
            storeFile file("../app/mcloud.jks")
            storePassword "420529"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    // Specifies one flavor dimension.
    flavorDimensions "version"
    productFlavors {
        dev_gz {//贵州专版
            dimension "version"
            applicationId "com.shmedo.mcloudappgz"
            resValue "string", "app_name", getAppName() + "贵州"   // 设置默认的app_name
            manifestPlaceholders = ["mapApikey": "6694cc57b25bd627c6c4e7aa2df0a081",
                                    "pgyerKey" : "5cc3cf1c0c3c3e204015fa232eedb439"]

            buildConfigField "String", "BUGLY_APPKEY", "\"6ff91a2c12\""
        }

        production {//正式发布版本
            dimension "version"
            applicationId "com.shmedo.mcloudapp"
            resValue "string", "app_name", getAppName()   // 设置默认的app_name
            manifestPlaceholders = ["mapApikey": "31d7ee436c402270e11183ce1b5d01dc",
                                    "pgyerKey" : "725bb8b9ee91e100e28d6623d8f8c86b"]

            buildConfigField "String", "BUGLY_APPKEY", "\"6b0340b2b8\""
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def NameSuffix = ""
            // To check for a certain build type, use variant.buildType.name == "<buildType>"
            if (variant.name.contains("dev_gz")) {
                NameSuffix = "贵州"
            }

            def fileName
            if (variant.buildType.name == "release") {
                fileName = getAppName() + NameSuffix + "_" + android.defaultConfig.versionName + "(" + gitShortCommitId() + ")" + ".apk"
            } else {
                fileName = getAppName() + NameSuffix + "_debug_" + android.defaultConfig.versionName + "(" + gitShortCommitId() + ")" + ".apk"
            }
            output.outputFileName = fileName
        }
    }
}


//greendao配置
greendao {
    //数据库版本号，升级时修改
    schemaVersion 5
}

