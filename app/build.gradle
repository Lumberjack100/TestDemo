/**
 * 获取Git库HEAD的SHA1码前5位
 */
def gitShortCommitId() {
    def cmd = 'git rev-parse --short HEAD'
    cmd.execute().text.trim()
}

/**
 * 获取Git库的提交次数
 */
def getReversion() {
    def buildnum = 1
    try {
        // 使用 ProcessBuilder 更可靠地执行命令
        def processBuilder = new ProcessBuilder("git", "rev-list", "--count", "HEAD")
        processBuilder.redirectErrorStream(true) // 将错误输出和标准输出合并
        def process = processBuilder.start()
        def output = process.text.trim() // 读取命令输出

        // 确保正确地关闭了进程的输入输出流
        process.inputStream.close()
        process.outputStream.close()
        process.errorStream.close()
        process.waitFor() // 等待进程结束

        if (output == '') {
            buildnum = 0 * 10000 + 0 * 1000 + 0 * 100
        } else {
            buildnum = output.toInteger()
        }
    } catch (e) {
        e.printStackTrace()
    }
    return buildnum
}

android {
    namespace "com.shmedo.mcloudapp"

    compileSdk libs.versions.compileSdk.get().toInteger()
    defaultConfig {
        applicationId "com.shmedo.mcloudapp.iot.v5"
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        versionCode getReversion()
        versionName '3.3.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue "string", "app_name", "米易通V5"   // 设置默认的app_name
        manifestPlaceholders = ["mapApikey"  : "61b252e0afae07eebf71fd8b519b511c",
                                "buglyAppId" : "09b15cd6a7",
                                "umengAppkey": "6209cd80226836222738b72b"]
        ndk {
            //设置支持的SO库架构（开发者可以根据需要，选择一个或多个平台的so）
            abiFilters "arm64-v8a", "armeabi-v7a"//"x86_64","x86", "armeabi", "armeabi-v7a"
        }
    }
    signingConfigs {
        release {
            keyAlias "mcloud"
            keyPassword "420529"
            storeFile file("../app/mcloud.jks")
            storePassword "420529"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
//        debug {
//            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
//            signingConfig signingConfigs.release
//        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        exclude 'META-INF/*'
    }

    android.applicationVariants.all { variant ->
        sourceSets {
            def name = variant.name
            getByName(name) {  //告知IDE，ksp生成的kotlin代码
                kotlin.srcDir("build/generated/ksp/$name/kotlin")
            }
        }
        variant.outputs.all {
            // 通过 variant 获取版本信息和构建类型
            def appName = project.hasProperty("appName") ? project.property("appName") : "米易通"
            def versionName = variant.versionName
            def buildType = variant.buildType.name
//            def flavorName = variant.flavorName // 或者使用 variant.productFlavors*.name.join("-") 获取具有多个 flavor 维度的情况
            def commitId = gitShortCommitId() // 获取 Git 提交 ID 的方法
            def buildNumber = getReversion() // 获取版本号的方法

            // 设置输出文件名
            def fileName = "${appName}_v${versionName}_${commitId}_${buildNumber}_${buildType}.apk"
            outputFileName = fileName
        }
    }
}

