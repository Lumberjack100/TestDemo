apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao'
apply plugin: 'com.jakewharton.butterknife'
apply plugin: 'kotlin-android'

/**
 * 获取APP名字
 * @return
 */
def getAppName() {
    return '米易通'
}

/**
 * 获取Git库HEAD的SHA1码前5位
 */
def gitShortCommitId() {
    def cmd = 'git rev-parse --short HEAD'
    cmd.execute().text.trim()
}

/**
 * 获取Git库的提交次数
 */
def gitVersionCode() {
    def cmd = 'git rev-list HEAD --count'
    cmd.execute().text.trim().toInteger()
}


android {
    compileSdkVersion rootProject.android.compileSdkVersion
    buildToolsVersion rootProject.android.buildToolsVersion

    defaultConfig {
        applicationId rootProject.android.applicationId
        minSdkVersion rootProject.android.minSdkVersion
        targetSdkVersion rootProject.android.targetSdkVersion
        versionCode gitVersionCode()
        versionName rootProject.android.versionName
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        ndk {
            //设置支持的SO库架构（开发者可以根据需要，选择一个或多个平台的so）
            abiFilters "x86", "armeabi", "armeabi-v7a"//"x86", "armeabi", "armeabi-v7a"
        }
    }

    signingConfigs {
        debug {
            keyAlias 'mcloud'
            keyPassword '420529'
            storeFile file('../app/mcloud.jks')
            storePassword '420529'
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            keyAlias "mcloud"
            keyPassword "420529"
            storeFile file("../app/mcloud.jks")
            storePassword "420529"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        exclude 'META-INF/*'
    }

    // Specifies one flavor dimension.
    flavorDimensions "version"
    productFlavors {

        production {//正式发布版本
            dimension "version"
            applicationId rootProject.android.applicationId
            resValue "string", "app_name", getAppName()   // 设置默认的app_name
            manifestPlaceholders = ["mapApikey"   : "31d7ee436c402270e11183ce1b5d01dc",
                                    "pgyerKey"    : "64454bf76fe2abd8dec45200c11fc93b",
                                    "frontJSToken": "d8b5d3a412f8493008be2052611789ea",
                                    "buglyAppId"  : "6b0340b2b8"]

            buildConfigField "String", "Dingding_APP_ID", "\"dingoa6lbfnghbtn0xeju0\""
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def NameSuffix = ""
            // To check for a certain build type, use variant.buildType.name == "<buildType>"
            if (variant.name.contains("dev_gz")) {
                NameSuffix = "贵州"
            }
            def fileName
            if (variant.buildType.name == "release") {
                fileName = getAppName() + NameSuffix + "_" + android.defaultConfig.versionName + "(" + gitShortCommitId() + ")" + ".apk"
            } else {
                fileName = getAppName() + NameSuffix + "_debug_" + android.defaultConfig.versionName + "(" + gitShortCommitId() + ")" + ".apk"
            }
            output.outputFileName = fileName
        }
    }
}

