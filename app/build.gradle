apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao'
android {
    compileSdkVersion COMPILE_SDK_VERSION as int
    defaultConfig {
        applicationId "com.shmedo.mcloudapp"
        minSdkVersion MIN_SDK_VERSION as int
        targetSdkVersion TARGET_SDK_VERSION as int
        versionCode VERSION_CODE as int
        versionName VERSION_NAME
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            storeFile file("../mcloud.jks")
            storePassword "420529"
            keyAlias "mcloud"
            keyPassword "420529"
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}


//greendao配置
greendao {
    //数据库版本号，升级时修改
    schemaVersion 5
}

dependencies {
    configurations {
        all*.exclude group: 'com.android.support', module: 'support-v13'
    }
    implementation project(path: ':picker-view')
    implementation group: 'org.reflections', name: 'reflections', version: '0.9.11'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "com.android.support:appcompat-v7:${SUPPORT_LIB_VERSION}"
    implementation "com.android.support:design:${SUPPORT_LIB_VERSION}"
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    implementation 'org.greenrobot:greendao:3.2.2'
    implementation 'com.jakewharton:butterknife:8.8.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:8.8.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.3'
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.2'
    implementation 'com.squareup.retrofit2:retrofit:2.5.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.4.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.4.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.11.0'
    // Glide
    implementation 'com.github.bumptech.glide:glide:4.8.0'
    //CircleImageView
    implementation 'de.hdodenhof:circleimageview:2.1.0'
    //Material Dialog
    implementation 'com.afollestad.material-dialogs:core:0.9.3.0'
    //eventbus
    implementation 'org.greenrobot:eventbus:3.1.1'
    //stetho
    implementation 'com.facebook.stetho:stetho:1.5.0'
    //fab
    implementation 'com.github.clans:fab:1.6.4'

    implementation 'cn.shmedo:das-config-base:4.0-SNAPSHOT'//自己封装的米度工具类库

    implementation 'jp.bassaer:chatmessageview:1.2.0'

    //mmkv
    implementation 'com.tencent:mmkv:1.0.19'
    //下拉刷新
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.0'
    //日志输出
    implementation 'com.jakewharton.timber:timber:4.7.1'
    //switchView 准备废弃
    implementation 'ch.ielse:switchbutton:1.0.1'
    implementation 'com.kyleduo.switchbutton:library:2.0.0'
    //新的zxing 扫码
    implementation 'cn.bingoogolapple:bga-qrcode-zxing:1.3.6'
    implementation 'cn.bingoogolapple:bga-photopicker:1.2.8@aar'
    implementation 'cn.bingoogolapple:bga-baseadapter:1.2.9@aar'
    //Toast 吐司
    implementation 'com.hjq:toast:8.0'//https://github.com/getActivity/ToastUtils

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}
