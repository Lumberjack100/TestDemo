apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao'
apply plugin: 'com.jakewharton.butterknife'

/**
 * 获取APP名字
 * @return
 */
def getAppName() {
    return '米易通'
}

/**
 * 获取Git库HEAD的SHA1码前5位
 */
def gitShortCommitId() {
    def cmd = 'git rev-parse --short HEAD'
    cmd.execute().text.trim()
}

/**
 * 获取Git库的提交次数
 */
def gitVersionCode() {
    def cmd = 'git rev-list HEAD --count'
    cmd.execute().text.trim().toInteger()
}


android {
    compileSdkVersion rootProject.android.compileSdkVersion
    buildToolsVersion rootProject.android.buildToolsVersion

    defaultConfig {
        applicationId rootProject.android.applicationId
        minSdkVersion rootProject.android.minSdkVersion
        targetSdkVersion rootProject.android.targetSdkVersion
        versionCode gitVersionCode()
        versionName rootProject.android.versionName
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        ndk {
            //设置支持的SO库架构（开发者可以根据需要，选择一个或多个平台的so）
            abiFilters "armeabi", "armeabi-v7a"//"x86", "armeabi", "armeabi-v7a"
        }
    }

    signingConfigs {
        debug {
            keyAlias 'mcloud'
            keyPassword '420529'
            storeFile file('../app/mcloud.jks')
            storePassword '420529'
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            keyAlias "mcloud"
            keyPassword "420529"
            storeFile file("../app/mcloud.jks")
            storePassword "420529"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    // Specifies one flavor dimension.
    flavorDimensions "version"
    productFlavors {

        production {//正式发布版本
            dimension "version"
            applicationId "com.shmedo.mcloudapp"
            resValue "string", "app_name", getAppName()   // 设置默认的app_name
            manifestPlaceholders = ["mapApikey" : "31d7ee436c402270e11183ce1b5d01dc",
                                    "pgyerKey"  : "b0183e481a993ef11d38ac43d8392436",
                                    "buglyAppId": "6b0340b2b8"]

//            buildConfigField "String", "BUGLY_APPKEY", "\"6b0340b2b8\""
            buildConfigField "String", "Dingding_APP_ID", "\"dingoa6lbfnghbtn0xeju0\""
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def NameSuffix = ""
            // To check for a certain build type, use variant.buildType.name == "<buildType>"
            if (variant.name.contains("dev_gz")) {
                NameSuffix = "贵州"
            }

            def fileName
            if (variant.buildType.name == "release") {
                fileName = getAppName() + NameSuffix + "_" + android.defaultConfig.versionName + "(" + gitShortCommitId() + ")" + ".apk"
            } else {
                fileName = getAppName() + NameSuffix + "_debug_" + android.defaultConfig.versionName + "(" + gitShortCommitId() + ")" + ".apk"
            }
            output.outputFileName = fileName
        }
    }
}

//greendao配置
greendao {
    //数据库版本号，升级时修改
    schemaVersion 19
    daoPackage "com.shmedo.mcloudapp.entity" // set package of generated classes
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(path: ':configlibrary')
    implementation project(path: ':core')

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    //AppCompat 依赖 androidx.fragment:fragment:1.3.0-alpha08 和 androidx.activity:activity:1.2.0-alpha08
    implementation 'androidx.appcompat:appcompat:1.3.0-alpha02'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation "com.google.android.material:material:$rootProject.thirdLib.material"
    implementation "androidx.lifecycle:lifecycle-runtime:2.2.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.2.0"
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.2.0'

    implementation 'com.kunminx.archi:unpeek-livedata:4.4.1-beta1'

    implementation "org.greenrobot:greendao:$rootProject.thirdLib.greendao"
    implementation "com.jakewharton:butterknife:$rootProject.thirdLib.butterknife"
    annotationProcessor "com.jakewharton:butterknife-compiler:$rootProject.thirdLib.butterknifeCompiler"

    implementation "io.reactivex.rxjava2:rxjava:$rootProject.thirdLib.rxjava"
    implementation "io.reactivex.rxjava2:rxandroid:$rootProject.thirdLib.rxandroid"
    implementation "com.squareup.retrofit2:retrofit:$rootProject.thirdLib.retrofit"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$rootProject.thirdLib.adapterRxjava"
    implementation "com.squareup.retrofit2:converter-gson:$rootProject.thirdLib.converterGson"
    implementation "com.squareup.okhttp3:logging-interceptor:$rootProject.thirdLib.loggingInterceptor"

    // debugImplementation because LeakCanary should only run in debug builds.
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.5'

    // Glide
    implementation "com.github.bumptech.glide:glide:$rootProject.thirdLib.glideVersion"
    //annotationProcessor "com.github.bumptech.glide:compiler:$rootProject.thirdLib.glideCompilerVersion"
    //CircleImageView
    implementation "de.hdodenhof:circleimageview:$rootProject.thirdLib.circleimageview"
    implementation "com.youth.banner:banner:$rootProject.thirdLib.banner"

    //Material Dialog
    implementation "com.afollestad.material-dialogs:core:$rootProject.thirdLib.materialDialogsCore"
    implementation "com.lxj:xpopup:$rootProject.thirdLib.xpopup"

    //fab
    implementation "com.github.clans:fab:$rootProject.thirdLib.fab"
    //This library aims to provide a chat UI view for Android.
    implementation "com.github.bassaer:chatmessageview:$rootProject.thirdLib.chatmessageview"

    //开关 Button
    implementation "com.kyleduo.switchbutton:library:$rootProject.thirdLib.switchbutton"
    //新的zxing 扫码
    implementation "cn.bingoogolapple:bga-qrcode-zxing:$rootProject.thirdLib.bgaQrcodeZxing"
    implementation "cn.bingoogolapple:bga-photopicker:$rootProject.thirdLib.bgaPhotoPicker"
    implementation "cn.bingoogolapple:bga-baseadapter:$rootProject.thirdLib.bgaBaseAdapter"
    //Toast 吐司
    implementation "com.hjq:toast:$rootProject.thirdLib.hjqToast"
    //蒲公英SDk
    implementation "com.pgyersdk:sdk:$rootProject.thirdLib.pgyerSdk"
    //异常信息上报组件
    implementation "com.tencent.bugly:crashreport:$rootProject.thirdLib.buglyCrashReport"
    implementation "com.tencent.bugly:nativecrashreport:$rootProject.thirdLib.buglyNativeCrashReport"

    //xCrash 能为安卓 app 提供捕获 java 崩溃，native 崩溃和 ANR 的能力。
    implementation 'com.iqiyi.xcrash:xcrash-android-lib:3.0.0'

    //AndPermission
    implementation "com.yanzhenjie:permission:$rootProject.thirdLib.AndPermission"
    implementation "com.yanzhenjie.recyclerview:x:$rootProject.thirdLib.SwipeRecyclerView"

    //下拉刷新
    implementation "com.scwang.smartrefresh:SmartRefreshLayout:$rootProject.thirdLib.SmartRefreshLayout"
    //一个强大并且灵活的RecyclerViewAdapter
    implementation "com.github.CymChad:BaseRecyclerViewAdapterHelper:$rootProject.thirdLib.BaseRecyclerViewAdapterHelper"
    implementation "gdut.bsx:share2:$rootProject.thirdLib.bsxShare"
    //钉钉官方分享 SDK
    implementation "com.alibaba.android:ddsharesdk:$rootProject.thirdLib.ddsharesdk"

    //高德地图导航
    implementation "com.amap.api:navi-3dmap:$rootProject.thirdLib.amapNavi"
    //高德地图定位功能
    implementation "com.amap.api:location:$rootProject.thirdLib.amapLocation"
    //高德地图搜索
    implementation "com.amap.api:search:$rootProject.thirdLib.amapSearch"

    // 透明系统栏设置基础依赖包，必须要依赖
    implementation 'com.gyf.immersionbar:immersionbar:3.0.0'
    // fragment快速实现（可选）
    implementation 'com.gyf.immersionbar:immersionbar-components:3.0.0'

    //The Scanner Compat library solves the problem with scanning for Bluetooth Low Energy devices on Android.
    implementation 'no.nordicsemi.android.support.v18:scanner:1.4.3'
    // Log Bluetooth LE events in nRF Logger APP
    implementation 'no.nordicsemi.android:log:2.3.0'
    // BLE library
    implementation 'no.nordicsemi.android:ble-livedata:2.2.0'

    testImplementation "junit:junit:$rootProject.thirdLib.junit"
    androidTestImplementation "androidx.test:runner:$rootProject.thirdLib.runner"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.thirdLib.espresso"
}
