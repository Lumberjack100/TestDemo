apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao'
apply plugin: 'com.jakewharton.butterknife'
/**
 * 获取打包时间
 * @return
 */
def releaseTime() {
    return new Date().format("yyyyMMddHHmm", TimeZone.getDefault())
}

def gitShortCommitId() {
    def cmd = 'git rev-parse --short HEAD'
    cmd.execute().text.trim()
}

def gitVersionCode() {
    def cmd = 'git rev-list HEAD --count'
    cmd.execute().text.trim().toInteger()
}


android {
    compileSdkVersion rootProject.ext.android.compileSdkVersion
    defaultConfig {
        applicationId rootProject.ext.android.applicationId
        minSdkVersion rootProject.ext.android.minSdkVersion
        targetSdkVersion rootProject.ext.android.targetSdkVersion
        versionCode gitVersionCode()
//        versionName "1.0.${releaseTime()}" //+ "(" + gitShortCommitId() + ")"
        versionName rootProject.ext.android.versionName
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = ["mapApikey":"6694cc57b25bd627c6c4e7aa2df0a081",
                                "pgyerKey":"5cc3cf1c0c3c3e204015fa232eedb439"]
    }

    signingConfigs {
        debug {
            keyAlias 'mcloud'
            keyPassword '420529'
            storeFile file('../app/mcloud.jks')
            storePassword '420529'
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            keyAlias "mcloud"
            keyPassword "420529"
            storeFile file("../app/mcloud.jks")
            storePassword "420529"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def fileName
            if (variant.buildType.name == "release") {
                fileName = "米易通_" + android.defaultConfig.versionName + "(" + gitShortCommitId() + ")" + ".apk"
            } else {
                fileName = "米易通_debug_" + android.defaultConfig.versionName + "(" + gitShortCommitId() + ")" + ".apk"
            }
            output.outputFileName = fileName
        }
    }
}


//greendao配置
