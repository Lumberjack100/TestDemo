plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.shmedo.lib.ble'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.espresso.core

    implementation project(":lib_core")
    implementation libs.androidx.appcompat
    implementation libs.androidx.lifecycle.viewmodel.ktx

    // 权限请求框架：https://github.com/getActivity/XXPermissions
    implementation libs.getActivity.xxpermission
    //Material Dialog
    implementation libs.bundles.material.dialogs
    //A logger with a small, extensible API which provides utility on top of Android's normal Log class.
    implementation libs.timber
    //AndroidUtilCode 是一个强大易用的安卓工具类库
    implementation libs.utilcodex

    //The Scanner Compat library solves the problem with scanning for Bluetooth Low Energy devices on Android.
    implementation libs.nordicsemi.scanner
    implementation libs.nordicsemi.ble.ktx


}