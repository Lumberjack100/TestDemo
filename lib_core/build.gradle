plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    alias(libs.plugins.android.ksp)
}

android {
    namespace 'com.shmedo.lib.core'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        dataBinding true
    }

    //ksp传参方式
    ksp {
        arg('room.schemaLocation', "$projectDir/schemas")
    }
}

dependencies {
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.espresso.core

    implementation libs.kotlin.stdlib.jdk8
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.kunminx.unpeek.livedata
    implementation libs.kunminx.strict.databinding
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    // 权限请求框架：https://github.com/getActivity/XXPermissions
    implementation libs.getActivity.xxpermission

    //Toast 吐司
    implementation libs.getActivity.toastutils
    //Material Dialog
    implementation libs.bundles.material.dialogs
    //A logger with a small, extensible API which provides utility on top of Android's normal Log class.
    implementation libs.timber
    //AndroidUtilCode 是一个强大易用的安卓工具类库
    implementation libs.utilcodex
    implementation libs.mmkv
    // Glide
    implementation libs.glide

    implementation libs.moshi
    ksp libs.moshi.kotlin.codegen
}