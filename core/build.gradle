apply plugin: 'com.android.library'

android {
    compileSdkVersion rootProject.android.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.android.minSdkVersion
        targetSdkVersion rootProject.android.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "androidx.appcompat:appcompat:$rootProject.thirdLib.appcompat"
    implementation 'androidx.exifinterface:exifinterface:1.2.0'
    api "com.jakewharton.timber:timber:$rootProject.thirdLib.timberVersion"
    api 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
    api 'com.zhihu.android:matisse:0.5.3-beta3'

    testImplementation "junit:junit:$rootProject.thirdLib.junit"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.thirdLib.testExtJunit"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.thirdLib.espresso"
}
