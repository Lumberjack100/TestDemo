
############################################
# Gradle / JVM（Gradle 8.x 推荐）
############################################
# 典型桌面开发机内存设置；CI 可按需下调
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8

# 并行构建设置（Gradle 8 默认就会并行；显式写有助于团队一致）
org.gradle.parallel=true
# 构建缓存设置
org.gradle.caching=true

# 是否启用配置缓存（Gradle 8 稳定可用，AGP 8 兼容性已较好，强烈建议开启）
org.gradle.configuration-cache=true

# 一般不手动限制 worker 数；只有在 CI/低配机器才考虑开启下一行
# org.gradle.workers.max=2


############################################
# AndroidX / Jetifier
############################################
android.useAndroidX=true
# 自动将第三方库转换为 AndroidX，Jetifier 已长期不推荐；仅当还有旧 support 依赖时才设为 true
android.enableJetifier=true


############################################
# Kotlin / KAPT 编译加速相关（能用 KSP 就尽量用 KSP）
############################################
# KAPT 增量与 worker（仍有用，但别过度微调）
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false

# Kotlin Daemon 内存（按项目规模微调）
kotlin.daemon.jvm.options=-Xmx2g


############################################
# R / DataBinding / 资源
############################################
# 非传递 R（强烈推荐，可显著加快构建）
android.nonTransitiveRClass=true

# 编译期 R（AGP 8.1+ 已默认优化；写与不写效果相同时可省略）
# android.enableAppCompileTimeRClass=true


############################################
# R8 / 混淆
############################################
# AGP 8 起，R8 已内置启用；旧的 fullMode 开关已废弃，务必删除
# android.enableR8.fullMode=true   <-- 删除这行

# 仅当你明确了解影响时才保留下面这个内部参数（会增大 dex 数量，但增量快）
# -Dcom.android.tools.r8.dexFilePerClassFile=true 需要放在 org.gradle.jvmargs 里
# org.gradle.jvmargs=... -Dcom.android.tools.r8.dexFilePerClassFile=true
